<header class="sticky top-0 z-40 border-b border-line bg-page/90 backdrop-blur">
  <div class="container-page flex h-16 items-center justify-between gap-4">
    <div class="flex items-center gap-1">
      <button
        type="button"
        class="-ml-2 grid size-11 place-items-center rounded-full text-muted hover:bg-surface hover:text-ink"
        aria-label="All tools"
        aria-controls="tools-drawer"
        [attr.aria-expanded]="drawerOpen()"
        title="All tools"
        (click)="openDrawer()"
      >
        <app-icon [path]="icons.menu" [size]="22" />
      </button>
      <a routerLink="/" class="flex items-center gap-2 rounded-lg">
        <span
          class="grid size-8 place-items-center rounded-lg bg-brand font-mono text-sm font-bold text-on-brand"
          aria-hidden="true"
          >&#123;&#125;</span
        >
        <span class="font-heading text-lg font-semibold">{{ siteName }}</span>
      </a>
    </div>

    <nav class="hidden md:block" aria-label="Main">
      <ul class="flex items-center gap-1">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="'/' + link.path"
              routerLinkActive="bg-surface !text-ink"
              ariaCurrentWhenActive="page"
              class="rounded-full px-3 py-2 text-sm font-semibold text-muted hover:text-ink"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      @if (install.available()) {
        <button type="button" class="flex h-11 items-center gap-2 rounded-full px-3 text-sm font-semibold text-brand hover:bg-surface" title="Install DevTools24 as an app" (click)="install.install()">
          <app-icon [path]="icons.download" [size]="20" />
          <span class="hidden sm:inline">Install app</span>
        </button>
      }
      <button
        type="button"
        class="flex h-11 items-center gap-2 rounded-full px-3 text-muted hover:bg-surface hover:text-ink"
        aria-label="Search tools"
        aria-keyshortcuts="Control+K Meta+K /"
        title="Search tools (Ctrl+K)"
        (click)="palette.show()"
      >
        <app-icon [path]="icons.search" [size]="20" />
        <kbd class="hidden rounded border border-line px-1.5 text-xs leading-5 lg:inline">Ctrl K</kbd>
      </button>
      <button
        type="button"
        class="grid size-11 place-items-center rounded-full text-muted hover:bg-surface hover:text-ink"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="theme.toggle()"
      >
        <app-icon [path]="theme.theme() === 'dark' ? icons.sun : icons.moon" [size]="20" />
      </button>

    </div>
  </div>

  <app-command-palette #palette />

  <dialog
    #drawer
    id="tools-drawer"
    class="drawer m-0 h-dvh max-h-none w-[min(23rem,88vw)] max-w-none border-r border-line bg-page p-0 text-ink backdrop:bg-black/40"
    aria-label="All tools"
    (close)="drawerOpen.set(false)"
    (click)="onDrawerClick($event)"
  >
    <div class="flex h-full flex-col">
      <div class="flex h-16 shrink-0 items-center justify-between border-b border-line px-4">
        <p class="font-heading text-lg font-semibold">All tools</p>
        <button type="button" class="grid size-10 place-items-center rounded-full text-muted hover:bg-surface hover:text-ink" aria-label="Close" (click)="closeDrawer()">
          <app-icon [path]="icons.close" [size]="20" />
        </button>
      </div>
      <app-tool-nav #toolNav class="min-h-0 flex-1" label="All tools in the menu" (navigated)="closeDrawer()" />
      <nav class="shrink-0 border-t border-line px-4 py-3 text-sm" aria-label="More pages">
        <ul class="flex flex-wrap gap-x-4 gap-y-1 text-muted">
          @for (link of pages; track link.path) {
            <li><a [routerLink]="'/' + link.path" class="hover:text-ink" (click)="closeDrawer()">{{ link.label }}</a></li>
          }
        </ul>
      </nav>
    </div>
  </dialog>
</header>
